<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนเวลา - ศูนย์วิจัยลดความเหลื่อมล้ำฯ มช.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        cirsoc: {
                            50: '#f9f5ff',
                            100: '#f0e6ff',
                            500: '#9b4dff',
                            700: '#7D12D9', 
                            900: '#4e088c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f3f4f6; color: #1f2937; }
        .table-container::-webkit-scrollbar { height: 8px; }
        .table-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-6xl w-full bg-white rounded-2xl shadow-xl overflow-hidden mb-8">
        <!-- ส่วนหัวของระบบ -->
        <div class="bg-cirsoc-700 px-6 py-10 flex flex-col items-center text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 rounded-full bg-white opacity-10 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-48 h-48 rounded-full bg-white opacity-10 pointer-events-none"></div>
            
            <div class="relative z-10 flex flex-col items-center">
                <div class="bg-white p-3.5 rounded-2xl shadow-lg mb-5 inline-flex items-center justify-center transform rotate-3">
                    <svg class="w-10 h-10 text-cirsoc-700 transform -rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold mb-3 text-white tracking-wide">ระบบลงทะเบียนเวลาปฏิบัติงาน</h1>
                <p class="text-cirsoc-50 text-sm md:text-base font-medium max-w-2xl mx-auto mb-1">
                    ศูนย์วิจัยลดความเหลื่อมล้ำ เพื่อสร้างโอกาสทางสังคม มหาวิทยาลัยเชียงใหม่ (CRIRSA)
                </p>
                <p class="text-cirsoc-100/70 text-xs md:text-sm">สำหรับนักศึกษาช่วยปฏิบัติงาน (Student Assistant)</p>
            </div>
        </div>

        <div class="p-6 md:p-8 flex flex-col lg:flex-row gap-8 bg-gray-50/50">
            <!-- ฟอร์มสำหรับกรอกข้อมูล -->
            <div class="w-full lg:w-1/3">
                <div class="bg-white rounded-xl p-6 border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-semibold text-cirsoc-900 mb-5 flex items-center border-b pb-3">
                        <svg class="w-5 h-5 mr-2 text-cirsoc-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        บันทึกการทำงาน
                    </h2>
                    
                    <form id="workLogForm" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-สกุล นักศึกษา</label>
                            <select id="studentName" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-cirsoc-500 focus:border-cirsoc-500 outline-none transition duration-200 bg-gray-50 focus:bg-white text-sm">
                                <option value="" disabled selected>-- เลือกชื่อนักศึกษา --</option>
                                <option value="นายวัธนชัย ไม้จำปา (บุ๊ค)">1. นายวัธนชัย ไม้จำปา (บุ๊ค)</option>
                                <option value="นางสาวปวรวรรณ สีมาพล (แพม)">2. นางสาวปวรวรรณ สีมาพล (แพม)</option>
                                <option value="นางสาวเข็มวดี วังคำ (น้ำอิง)">3. นางสาวเข็มวดี วังคำ (น้ำอิง)</option>
                                <option value="นายสุรเชษฐ์ มีบุตร (มิกซ์)">4. นายสุรเชษฐ์ มีบุตร (มิกซ์)</option>
                                <option value="นายไชยพร พรหมมา (เกื้อ)">5. นายไชยพร พรหมมา (เกื้อ)</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">วันที่เข้าปฏิบัติงาน</label>
                            <input type="date" id="workDate" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-cirsoc-500 outline-none transition duration-200 bg-gray-50 focus:bg-white text-sm">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนชั่วโมงที่ทำ (ชม.)</label>
                            <input type="number" id="workHours" required min="0.5" step="0.5" placeholder="เช่น 2, 3.5, 4" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-cirsoc-500 outline-none transition duration-200 bg-gray-50 focus:bg-white text-sm">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียดการทำงาน</label>
                            <textarea id="workDetails" required rows="3" placeholder="ระบุงานที่ได้รับมอบหมาย..." class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-cirsoc-500 outline-none transition duration-200 resize-none bg-gray-50 focus:bg-white text-sm"></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-cirsoc-700 hover:bg-cirsoc-900 text-white font-medium py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-200 flex justify-center items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            <span>บันทึกข้อมูล</span>
                        </button>
                    </form>
                    
                    <div id="toastSuccess" class="hidden mt-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg relative text-sm flex items-center">
                        <svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span class="block sm:inline font-medium" id="toastMessage">บันทึกข้อมูลสำเร็จ!</span>
                    </div>
                </div>
            </div>

            <!-- ตารางแสดงข้อมูลที่บันทึกแล้ว -->
            <div class="w-full lg:w-2/3">
                <div class="flex justify-between items-end mb-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-semibold text-gray-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        ประวัติการทำงาน (ล่าสุด)
                    </h2>
                    <div class="text-right">
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">ชั่วโมงรวมทั้งหมด</p>
                        <p class="text-3xl font-bold text-cirsoc-700" id="totalHoursDisplay">0 ชม.</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm table-container overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left font-semibold text-gray-600 tracking-wider">วันที่</th>
                                <th class="px-6 py-4 text-left font-semibold text-gray-600 tracking-wider">ผู้ปฏิบัติงาน</th>
                                <th class="px-6 py-4 text-left font-semibold text-gray-600 tracking-wider">รายละเอียด</th>
                                <th class="px-6 py-4 text-center font-semibold text-gray-600 tracking-wider">ชั่วโมง</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="bg-white divide-y divide-gray-100">
                            <!-- ข้อมูลจะถูกเพิ่มที่นี่ -->
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // นำ URL ที่ได้จาก Google Apps Script มาวางในเครื่องหมายคำพูดด้านล่างนี้ครับ
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdi2Mo_YExPh0_zgrPVFLxjNMmV7rsjF2AgXw_pDv9Q-oI1-w2_cQnRDUQ2bX-YZaj/exec';

        let workLogs = [];

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('workDate').value = today;
            fetchLogsFromSheet();
        });

        // ดึงข้อมูลล่าสุดจาก Google Sheets มาแสดง (ให้ทุกคนเห็นตารางเดียวกัน)
        function fetchLogsFromSheet() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-gray-400">กำลังโหลดข้อมูล...</td></tr>`;

            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    workLogs = Array.isArray(data) ? data : [];
                    renderTable();
                })
                .catch(error => {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-red-400">โหลดข้อมูลไม่สำเร็จ: ${error}</td></tr>`;
                });
        }

        document.getElementById('workLogForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (GOOGLE_SCRIPT_URL === 'วางลิงก์ที่นี่' || GOOGLE_SCRIPT_URL === '') {
                alert("กรุณาใส่ลิงก์ Google Apps Script ในโค้ดก่อนทำการบันทึกข้อมูลครับ");
                return;
            }

            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('span');
            btn.disabled = true;
            btnText.innerText = 'กำลังส่งข้อมูล...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            const name = document.getElementById('studentName').value;
            const date = document.getElementById('workDate').value;
            const hours = parseFloat(document.getElementById('workHours').value);
            const details = document.getElementById('workDetails').value.trim();

            const data = {
                name: name,
                date: date,
                hours: hours,
                details: details
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data),
                mode: 'no-cors'
            }).then(() => {
                // ดึงข้อมูลล่าสุดจาก Sheets กลับมาแสดง แทนการเก็บไว้แค่ในเครื่อง
                fetchLogsFromSheet();

                document.getElementById('workHours').value = '';
                document.getElementById('workDetails').value = '';
                
                btn.disabled = false;
                btnText.innerText = 'บันทึกข้อมูล';
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                
                showToast("บันทึกข้อมูลลง Google Sheets สำเร็จ!");
            }).catch(error => {
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + error);
                btn.disabled = false;
                btnText.innerText = 'บันทึกข้อมูล';
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
        });

        function renderTable() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = ''; 

            if (workLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-gray-400">ยังไม่มีข้อมูลการลงทะเบียนเวลาในระบบ</td></tr>`;
                document.getElementById('totalHoursDisplay').innerText = '0 ชม.';
                return;
            }

            const sortedLogs = [...workLogs].sort((a, b) => new Date(b.date) - new Date(a.date));
            let totalHours = 0;

            sortedLogs.forEach((log) => {
                totalHours += log.hours;
                const thaiDate = new Date(log.date).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-cirsoc-50 transition duration-150';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-gray-900">${thaiDate}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-cirsoc-900">${escapeHTML(log.name)}</td>
                    <td class="px-6 py-4 text-gray-600 break-words">${escapeHTML(log.details)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center font-bold text-gray-800 bg-gray-50/50">${log.hours}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalHoursDisplay').innerText = totalHours + ' ชม.';
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;','<': '&lt;','>': '&gt;',"'": '&#39;','"': '&quot;'}[tag] || tag));
        }

        function showToast(message) {
            const toast = document.getElementById('toastSuccess');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 4000);
        }
    </script>
</body>
</html>
